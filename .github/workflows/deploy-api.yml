name: Deploy API

# Deploys the FastAPI container to Cloud Run in the moneyflow-coach project.
# Firebase Hosting rewrites /api/** to this service, so the web app stays
# same-origin. Requires the project to be on the Blaze plan and the
# GCP_SERVICE_ACCOUNT secret to hold a JSON key with Cloud Run Admin,
# Artifact Registry Writer and Service Account User roles.

# Manual trigger only until the project is on Blaze and the secret exists
# (phase 6). Then add back:
#   push:
#     branches: [main]
#     paths: ['api/**', '.github/workflows/deploy-api.yml']
on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: moneyflow-coach
  REGION: us-central1
  SERVICE: moneyflow-api
  REPO: moneyflow

jobs:
  deploy:
    name: Build image and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: api
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --set-env-vars "MONEYFLOW_ENV=production,MONEYFLOW_FIREBASE_PROJECT_ID=${PROJECT_ID}" \
            --set-secrets "MONEYFLOW_GEMINI_API_KEY=GEMINI_API_KEY:latest"
