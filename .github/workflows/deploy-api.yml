name: Deploy API

# Builds the FastAPI container and deploys it to Cloud Run in moneyflow-coach.
# Firebase Hosting rewrites /api/** to this service, so the web app stays
# same-origin. Uses the same github-deployer identity as the web deploy; its
# roles are granted by scripts/setup-deployer.sh. The service's public-invoke
# binding is set once by that script and persists across revisions.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: moneyflow-coach
  REGION: us-central1
  SERVICE: moneyflow-api
  REPO: moneyflow
  RUNTIME_SA: moneyflow-api-runtime@moneyflow-coach.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build image and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: api
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The Gemini key is added with --set-secrets in phase 6.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --set-env-vars "MONEYFLOW_ENV=production,MONEYFLOW_FIREBASE_PROJECT_ID=${PROJECT_ID}"

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          curl -fsS "$URL/api/health"
