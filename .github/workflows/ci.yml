name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @moneyflow/web exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm --filter @moneyflow/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm install --frozen-lockfile

      - name: Run rules tests against the emulator
        run: |
          npx firebase-tools@latest emulators:exec --only firestore --project moneyflow-rules-test \
            "pnpm --filter @moneyflow/web test:rules"

  api:
    name: API (ruff, mypy, pytest, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - run: uv python install
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

      - name: Docker build
        run: docker build -t moneyflow-api:ci .

      - name: Container smoke test
        run: |
          docker run -d --rm --name api -p 8080:8080 -e MONEYFLOW_ENV=production moneyflow-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
